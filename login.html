<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner login</title><link rel="stylesheet" href="/styles.css"></head>
<body><main><section class="card"><h1>Owner login</h1>
<form id="loginForm"><p><label>Username <input id="username" autocomplete="username" required maxlength="128"></label></p>
<p><label>Password <input id="password" type="password" autocomplete="current-password" required maxlength="1024"></label></p>
<button type="submit">Log in</button><p id="loginMessage" role="status"></p></form>
</section></main><script type="module" src="/login.js"></script></body>
</html>
